<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1c1609"/>
      <stop offset="100%" stop-color="#0a0805"/>
    </radialGradient>
    <radialGradient id="gold" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f0e6cc"/>
      <stop offset="50%" stop-color="#d4af6a"/>
      <stop offset="100%" stop-color="#8a7548"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="4" fill="url(#bg)"/>

  <!-- Outer diamond -->
  <polygon
    points="16,2 30,16 16,30 2,16"
    fill="none"
    stroke="url(#gold)"
    stroke-width="1.5"
  />

  <!-- Inner diamond fill (subtle) -->
  <polygon
    points="16,5 27,16 16,27 5,16"
    fill="#a88c4a"
    opacity="0.12"
  />

  <!-- Middle diamond -->
  <polygon
    points="16,8 24,16 16,24 8,16"
    fill="none"
    stroke="#a88c4a"
    stroke-width="0.8"
    opacity="0.6"
  />

  <!-- Centre mark -->
  <polygon
    points="16,12 20,16 16,20 12,16"
    fill="url(#gold)"
  />

  <!-- Corner dots -->
  <circle cx="16" cy="2"  r="1" fill="#d4af6a" opacity="0.8"/>
  <circle cx="30" cy="16" r="1" fill="#d4af6a" opacity="0.8"/>
  <circle cx="16" cy="30" r="1" fill="#d4af6a" opacity="0.8"/>
  <circle cx="2"  cy="16" r="1" fill="#d4af6a" opacity="0.8"/>
</svg>
